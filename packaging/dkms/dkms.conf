PACKAGE_NAME="socksdirect"
PACKAGE_VERSION="0.1.0"

# These map onto the kernel-source files; the LKM build per Phase 5
# replaces the syscall-overlay approach in zerocopy/linux/. Update once
# the LKM lands.
BUILT_MODULE_NAME[0]="socksdirect"
BUILT_MODULE_LOCATION[0]="src/kernel"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"

MAKE[0]="make -C src/kernel KERNELRELEASE=$kernelver"
CLEAN="make -C src/kernel clean"
