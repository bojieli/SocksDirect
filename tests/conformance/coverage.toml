# Conformance coverage matrix — single source of truth for libc
# function support levels. `tests/conformance/run_conformance.py`
# walks this file. `docs/API.md` is regenerated from it (Phase 4).
#
# status options:
#   accelerated   — libsd handles on the fast path
#   passthrough   — libsd recognizes but forwards to glibc
#   partial       — libsd partially handles; outcome is documented
#   unsupported   — libsd refuses; returns an error
#
# case: relative to tests/conformance/. May be:
#   - a path to a C source under cases/
#   - the literal "ltp:<test_name>" referencing an LTP test
#
# fix_phase: when this column is non-empty, the function is on the
#            REWRITE_PLAN list to upgrade its status. The number is
#            the phase doing the work.

[[function]]
name        = "socket"
status      = "accelerated"
case        = "cases/socket_basic.c"
notes       = "AF_INET/SOCK_STREAM is fast-path; others passthrough"

